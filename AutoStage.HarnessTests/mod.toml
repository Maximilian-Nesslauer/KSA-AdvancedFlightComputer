name = "AutoStage.HarnessTests"

[StarMap]
EntryAssembly = "AutoStage.HarnessTests"

# The HeadlessHarness dependency marks this folder as a harness consumer, so the harness loads this
# assembly and discovers its IHarnessTest classes during a headless run. AutoStage is the mod under
# test.
[[StarMap.ModDependencies]]
ModId = "HeadlessHarness"
Optional = false

[[StarMap.ModDependencies]]
ModId = "AutoStage"
Optional = false
